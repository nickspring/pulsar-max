[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# pulsar crates come from an upstream tag; external dependencies are pinned exactly as in
# satellite/Cargo.toml of that tag, so the build has one version of each.
[workspace.dependencies]
pulsar-core = { git = "https://github.com/Morvex885/pulsar", tag = "v0.6.1" }
pulsar-esphome = { git = "https://github.com/Morvex885/pulsar", tag = "v0.6.1" }
pulsar-lan = { git = "https://github.com/Morvex885/pulsar", tag = "v0.6.1" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "signal", "process", "io-util", "fs"] }
log = { version = "=0.4.34", features = ["std"] }
libc = "=0.2.191"
socket2 = { version = "=0.6.5", features = ["all"] }

# Android build fix for pulsar-lan; drop once it is upstream. See third_party/README.md.
[patch."https://github.com/Morvex885/pulsar"]
pulsar-lan = { path = "third_party/pulsar-lan" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
debug = "line-tables-only"
strip = false

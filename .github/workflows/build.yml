name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 30.0.16248370
  ANDROID_PLATFORM: android-33
  BUILD_TOOLS: 36.0.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/sendspin-cpp
            build/sendspin-cpp.ndk
            third_party/sendspin-cpp/src
          key: ${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'third_party/sendspin-cpp/fetch.sh', 'third_party/sendspin-cpp/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ env.NDK_VERSION }}-

      - run: make check
      - run: make all

      - name: Package
        run: |
          version=$(git describe --tags --match 'v*' --always)
          name=pulsar-max-$version
          mkdir -p "dist/$name/build" "dist/$name/deploy" "dist/$name/tools"
          cp build/pulsar-max build/helper.dex "dist/$name/build/"
          cp deploy/ctl.sh deploy/supervise.sh deploy/pulsar-max.rc "dist/$name/deploy/"
          cp tools/install.sh "dist/$name/tools/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp build/pulsar-max.debug "dist/$name.debug"
          (cd dist && sha256sum "$name.tar.gz" "$name.debug" > SHA256SUMS)
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.tar.gz
            dist/*.debug
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
